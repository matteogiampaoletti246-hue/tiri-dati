<!doctype html>
<html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E1526">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ScalperLab">
<title>ScalperLab</title>
<script>
(function(){var t='light';try{t=localStorage.getItem('slbTheme')||'light';}catch(e){}
if(t==='auto'){t=(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)?'night':'light';}
var c=t==='night'?'#0E1526':'#ffffff';
document.write('<style>html,body{margin:0;background:'+c+'}</style>');
var m=document.querySelector('meta[name=theme-color]');if(m)m.content=c;})();
</script></head>
<body>
<script>
fetch('loader.js?v=' + Date.now()).then(function(r){
  if(!r.ok) throw new Error('loader.js non trovato');
  return r.text();
}).then(function(t){
  var sc = document.createElement('script'); sc.textContent = t; document.body.appendChild(sc);
}).catch(function(e){ document.body.textContent = 'Errore: ' + e.message; });
</script>
</body></html>
