<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ScalperLab nativa</title>
<style>body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:#05070D;color:#F1F5FB;font:16px -apple-system,system-ui,sans-serif;text-align:center;padding:24px}a{display:inline-block;padding:14px 22px;border-radius:14px;background:#4DA8FF;color:#05070D;font-weight:700;text-decoration:none}small{color:#6D7A91}</style></head>
<body><div id="t">Apro ScalperLab in Expo Go…</div><a id="b" href="#" style="display:none">Apri in Expo Go</a><small id="s"></small>
<script>
(async()=>{
 try{
  const r=await fetch('latest.json?'+Date.now(),{cache:'no-store'});const j=await r.json();
  const u='exp://u.expo.dev/'+j.id+'/group/'+j.group;
  const b=document.getElementById('b');b.href=u;b.style.display='inline-block';
  document.getElementById('s').textContent='Versione del '+j.at;
  location.href=u;
 }catch(e){document.getElementById('t').textContent='Non riesco a leggere l\'ultima versione. Riprova tra poco.'}
})();
</script></body></html>
