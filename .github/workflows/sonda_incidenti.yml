name: Sonda incidenti LiveScore
on: workflow_dispatch
permissions:
  contents: write
jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python sonda_incidenti.py
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add sonda_incidenti.json
          git diff --staged --quiet || git commit -m "Sonda LiveScore/OneFootball"
          for i in 1 2 3 4 5; do git pull --rebase && git push && break; sleep $((i*4)); done
