name: Aurora indice
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: aurora-indice
  cancel-in-progress: false
jobs:
  indice:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python aurora_indice.py
      - run: python update_ali.py
      - name: Salva
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add aurora_indice.json ali.json
          git diff --staged --quiet || git commit -m "Aurora indice"
          for i in 1 2 3 4 5; do git pull --rebase && git push && break; sleep $((i*4)); done
