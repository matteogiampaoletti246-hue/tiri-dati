name: Zone classifica
on:
  workflow_dispatch:
  schedule:
    - cron: "40 4 * * 1"
permissions:
  contents: write
concurrency:
  group: zone
jobs:
  zone:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python update_zone.py
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add zone.json
          git diff --staged --quiet || git commit -m "Aggiorna zone classifica"
          for i in 1 2 3 4 5; do git pull --rebase && git push && break; sleep $((i*4)); done
