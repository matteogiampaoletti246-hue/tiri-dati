name: Sonda verso LiveScore
on:
  workflow_dispatch:
  push:
    paths:
      - tools/sonda_verso_ls.py
permissions:
  contents: write
jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/sonda_verso_ls.py
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add report/sonda_verso_ls.json
          git diff --staged --quiet || git commit -m "Sonda verso LiveScore"
          for i in 1 2 3 4 5; do git pull --rebase && git push && break; sleep $((i*4)); done
