name: Statistiche giocatori da PitchAPI (livello 3 della gerarchia)
on:
  workflow_dispatch:
  schedule:
    - cron: "23 */3 * * *"
concurrency:
  group: partite-main
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  pitch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python giocatori_pitch.py
        env:
          PITCHAPI_KEY: ${{ secrets.PITCHAPI_KEY }}
          MAX_MIN: "40"
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add partite pitch_giocatori.json
          git diff --staged --quiet || git commit -m "Statistiche giocatori da PitchAPI"
          for i in 1 2 3 4 5; do git pull --rebase -X theirs && git push && break; sleep $((i*4)); done
