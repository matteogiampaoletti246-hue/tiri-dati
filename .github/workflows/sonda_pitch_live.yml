name: Sonda PitchAPI live
on: workflow_dispatch
permissions:
  contents: read
jobs:
  sonda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python sonda_pitch_live.py
        env:
          PITCHAPI_KEY: ${{ secrets.PITCHAPI_KEY }}
