name: Eventi delle partite finite da LiveScore (KV)
on:
  workflow_dispatch:
  schedule:
    - cron: "17 */3 * * *"
concurrency:
  group: partite-main
  cancel-in-progress: false
permissions:
  contents: write
  actions: write
jobs:
  pitch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python eventi_livescore.py
        env:
          MAX_MIN: "40"
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: 344b4f68fd540269085abbf16851253c
          CF_NAMESPACE: 02759a8a953d423dbd19c58fb8241c34
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add eventi_livescore.json eventi_stato.json
          git diff --staged --quiet || git commit -m "Eventi partite da LiveScore"
          for i in 1 2 3 4 5; do git pull --rebase -X theirs && git push && break; sleep $((i*4)); done
