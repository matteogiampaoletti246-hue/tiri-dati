name: Indice squadre
on:
  schedule:
    - cron: "55 5 * * *"
  workflow_dispatch:
  push:
    paths:
      - squadre_indice.py
permissions:
  contents: write
jobs:
  indice:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python squadre_indice.py
      - name: Salva i risultati
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add tidx
          git diff --staged --quiet || git commit -m "Aggiorna indice squadre"
          for i in 1 2 3 4 5; do git pull --rebase && git push && break; sleep $((i*4)); done
