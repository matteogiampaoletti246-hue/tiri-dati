name: Diagnosi live 2
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  diagnosi:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python diagnosi_live2.py
        env:
          PITCHAPI_KEY: ${{ secrets.PITCHAPI_KEY }}
      - name: Salva
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add diag_live2.json
          git diff --staged --quiet || git commit -m "Diagnosi live 2"
          for i in 1 2 3 4 5; do git pull --rebase && git push && break; sleep 5; done
