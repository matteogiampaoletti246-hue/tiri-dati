name: Diagnosi API-Football
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python diagnosi_apifootball.py
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add diag_apifootball.json
          git diff --staged --quiet || git commit -m "Diagnosi API-Football"
          for i in 1 2 3 4 5; do git pull --rebase && git push && break; sleep $((i*4)); done
