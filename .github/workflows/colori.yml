name: Colori squadre
on:
  workflow_dispatch:
  push:
    paths:
      - colori.trigger
concurrency:
  group: colori
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  colori:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: python -u colori.py
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add arch/colors.json
          git diff --staged --quiet || git commit -m "Colori squadre"
          for i in 1 2 3 4 5 6; do git pull --rebase && git push && break; sleep $((i*5)); done
