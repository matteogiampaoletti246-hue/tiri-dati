name: Anteprima app (iPhone)
# Costruisce l'app dal ramo "dev", la apre in WebKit (Safari) con un iPhone emulato e salva screenshot e rapporto
# nel ramo "preview-out". Non tocca il sito pubblicato.
on:
  push:
    branches: [dev]
    paths:
      - aurora-src/**
      - .github/webkit/preview.mjs
      - .github/webkit/serve.mjs
      - .github/workflows/aurora_preview.yml
      - data-trigger.preview
  workflow_dispatch:
concurrency:
  group: aurora-preview
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    container:
      image: mcr.microsoft.com/playwright:v1.47.2-jammy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Costruisce l'app
        run: |
          cd aurora-src
          npm ci --no-audit --no-fund
          npm run build 2>&1 | tail -30
          cd ..
          rm -rf aurora && cp -r aurora-src/dist aurora
          ls aurora aurora/assets | head -20
      - name: Prova su iPhone (WebKit)
        timeout-minutes: 25
        run: |
          mkdir -p /tmp/wk && cp .github/webkit/preview.mjs .github/webkit/serve.mjs /tmp/wk/
          cd /tmp/wk && npm init -y >/dev/null && npm i playwright@1.47.2 --no-audit --no-fund >/dev/null
          node serve.mjs "$GITHUB_WORKSPACE" 8080 &
          sleep 2
          cd /tmp/wk && BASE=http://localhost:8080/ node preview.mjs || true
          cp -r /tmp/wk/preview-out "$GITHUB_WORKSPACE/preview-out" || true
      - name: Salva il rapporto nel ramo preview-out
        if: always()
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          mkdir -p /tmp/po && cp -r preview-out/. /tmp/po/ 2>/dev/null || true
          echo "$GITHUB_SHA" > /tmp/po/commit.txt
          cd /tmp/po && git init -q -b preview-out && git config user.name github-actions && git config user.email github-actions@users.noreply.github.com
          git add -A && git commit -qm "Anteprima $GITHUB_SHA"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" preview-out
