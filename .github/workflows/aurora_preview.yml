name: Anteprima app (iPhone)
# Costruisce l'app dal ramo "dev", la apre in WebKit (Safari) con un iPhone emulato e salva screenshot e rapporto
# nel ramo "preview-out". Non tocca il sito pubblicato.
# I controlli si dividono tra 2 job in parallelo (SHARD/NSHARD in preview.mjs): stessi controlli, meta' del tempo.
on:
  push:
    branches: [dev, rose-stat]
    paths:
      - aurora-src/**
      - .github/webkit/preview.mjs
      - .github/webkit/serve.mjs
      - .github/workflows/aurora_preview.yml
      - data-trigger.preview
  workflow_dispatch:
concurrency:
  group: aurora-preview
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: aurora-src/package-lock.json
      - name: Costruisce l'app
        run: |
          cd aurora-src
          npm ci --no-audit --no-fund
          npm run build 2>&1 | tail -30
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: aurora-src/dist
          retention-days: 1

  preview:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.47.2-jammy
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    steps:
      - uses: actions/checkout@v4
      - run: rm -rf aurora
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: aurora
      - name: Prova su iPhone (WebKit)
        timeout-minutes: 25
        run: |
          mkdir -p /tmp/wk && cp .github/webkit/preview.mjs .github/webkit/serve.mjs /tmp/wk/
          cd /tmp/wk && npm init -y >/dev/null && npm i playwright@1.47.2 --no-audit --no-fund >/dev/null
          node serve.mjs "$GITHUB_WORKSPACE" 8080 &
          sleep 2
          cd /tmp/wk && SHARD=${{ matrix.shard }} NSHARD=2 BASE=http://localhost:8080/ node preview.mjs || true
          cp -r /tmp/wk/preview-out "$GITHUB_WORKSPACE/preview-out" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preview-${{ matrix.shard }}
          path: preview-out
          retention-days: 3

  report:
    needs: preview
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: preview-*
          path: parts
      - name: Unisce i rapporti e li salva nel ramo preview-out
        run: |
          mkdir -p /tmp/po
          for d in parts/preview-*; do cp -r "$d"/. /tmp/po/ 2>/dev/null || true; done
          node -e '
            const fs = require("fs");
            const parts = fs.readdirSync("parts").map((d) => { try { return JSON.parse(fs.readFileSync(`parts/${d}/report.json`)); } catch { return null; } }).filter(Boolean);
            const r = { when: new Date().toISOString(), checks: [], errors: [], console: [], failed: [], shards: parts.length };
            for (const p of parts) { for (const k of Object.keys(p)) { if (Array.isArray(p[k]) && Array.isArray(r[k])) r[k].push(...p[k]); else if (!(k in r)) r[k] = p[k]; } }
            r.passed = r.checks.filter((c) => c.pass).length; r.total = r.checks.length;
            fs.writeFileSync("/tmp/po/report.json", JSON.stringify(r, null, 2));
            console.log(JSON.stringify({ shards: r.shards, passed: r.passed, total: r.total, failed: r.failed }, null, 1));
          '
          echo "$GITHUB_SHA" > /tmp/po/commit.txt
          cd /tmp/po && git init -q -b preview-out && git config user.name github-actions && git config user.email github-actions@users.noreply.github.com
          git add -A && git commit -qm "Anteprima $GITHUB_SHA"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" preview-out
