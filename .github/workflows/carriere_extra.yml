name: Carriere e foto di tutti i giocatori
# Carriere di TUTTI i giocatori dell'indice pidx (carriere_extra.py): prima le rose, poi chi gioca la stagione in corso, poi gli altri
# per shard. Blocchi da ~5 ore, UN commit per blocco (pochi commit grandi); si riparte da solo finche' mancano giocatori, ma solo se
# il blocco ha scaricato qualcosa (niente cicli infiniti se FotMob blocca). Stato in car/.stato.json.
on:
  schedule:
    - cron: "40 3 * * 3"
  workflow_dispatch:
  push:
    paths:
      - carriere_extra.py
concurrency: carriere
permissions:
  contents: write
  actions: write
jobs:
  carriere:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      # solo libreria standard: basta il python3 del runner
      - run: python3 carriere_extra.py 310
      # quali giocatori non hanno la foto su FotMob (l'app mostra subito l'omino)
      - run: python3 foto_check.py || true
      # id FotMob per chi non ha foto nelle altre fonti (calcolatore, ricerca)
      - run: python3 foto_fm.py || true
      - name: Salva i risultati
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add car foto_mancanti.json foto_check_cache.json foto_fm.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "Carriere giocatori (blocco)"
          for i in 1 2 3 4 5; do git pull --rebase && git push && break; sleep $((i*4)); done
      - name: Riparti se mancano giocatori e il blocco ha scaricato qualcosa
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -c "import json,sys; s=json.load(open('car/.stato.json')); print(s); sys.exit(0 if s.get('mancano',0)>0 and s.get('nuovi',0)>0 else 1)" \
            && gh workflow run carriere_extra.yml --ref ${{ github.ref_name }} || echo "fine o fermo: nessuna ripartenza"
