name: Foto giocatori da altre fonti (LiveScore, diretta.it)
on:
  workflow_dispatch:
  schedule:
    - cron: "23 5,11,17,23 * * *"
concurrency:
  group: foto-extra
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  foto:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python foto_extra.py
        env:
          MAX_MIN: "25"
          SEARCH_MIN: "70"
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: 344b4f68fd540269085abbf16851253c
          CF_NAMESPACE: 02759a8a953d423dbd19c58fb8241c34
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add foto_extra_stato.json report/foto_extra.json
          git diff --staged --quiet || git commit -m "Foto giocatori da altre fonti"
          for i in 1 2 3 4 5; do git pull --rebase -X theirs && git push && break; sleep $((i*4)); done
