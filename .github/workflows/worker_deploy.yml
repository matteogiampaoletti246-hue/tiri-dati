name: Pubblica worker Cloudflare
# Ogni modifica a worker/ viene pubblicata da sola su Cloudflare (prima andava fatto a mano).
on:
  push:
    branches: [main]
    paths: ['worker/**', '.github/workflows/worker_deploy.yml']
  workflow_dispatch:
concurrency:
  group: worker-deploy
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Pubblica
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 344b4f68fd540269085abbf16851253c
        run: |
          set +e
          npx --yes wrangler@3 deploy > ../worker_deploy_esito.txt 2>&1
          echo "exit=$?" >> ../worker_deploy_esito.txt
          sed -i -E 's/[A-Za-z0-9_-]{35,}/<nascosto>/g' ../worker_deploy_esito.txt
          exit $(tail -1 ../worker_deploy_esito.txt | sed 's/exit=//')
      - name: Esito
        if: always()
        run: |
          git config user.name github-actions; git config user.email actions@github.com
          git add worker_deploy_esito.txt && git commit -qm 'Esito pubblicazione worker' && git pull -q --rebase && git push -q || true
