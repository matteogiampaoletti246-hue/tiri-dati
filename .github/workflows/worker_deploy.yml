name: Pubblica worker
# Alternativa a "Workers Builds" di Cloudflare (falliva su ogni commit dal 13/11/2026): pubblica il worker solo quando cambia worker/.
on:
  workflow_dispatch:
  push:
    paths:
      - "worker/**"
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 344b4f68fd540269085abbf16851253c
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Controllo sintassi
        run: npx --yes esbuild worker/index.js --bundle --format=esm --outfile=/dev/null
      - name: Pubblica
        working-directory: worker
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "CLOUDFLARE_API_TOKEN mancante"; exit 1; fi
          npx --yes wrangler@4 deploy
