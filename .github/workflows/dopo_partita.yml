name: Aggiornamento dopo partita
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
concurrency:
  group: dopo-partita
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  rapido:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ci sono partite appena finite?
        id: gate
        run: python dopo_partita.py
      - name: Partite e voti
        if: steps.gate.outputs.go == '1'
        continue-on-error: true
        env:
          PITCHAPI_KEY: ${{ secrets.PITCHAPI_KEY }}
          MAX_MIN: "8"
        run: |
          python update_storico.py
          python update_players.py
      - name: Statistiche e indici
        if: steps.gate.outputs.go == '1'
        continue-on-error: true
        run: |
          python update_stats_ex.py
          python aurora_indice.py
          python update_ali.py
      - name: Salva
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          for f in dopo_partita.json dopo_partita_diag.json match storico.json arbitri.json stadi.json player_keys.json stats_ex.json squadre_ex.json ruoli.json aurora_indice.json ali.json; do [ -e "$f" ] && git add "$f"; done; true
          git diff --staged --quiet || git commit -m "Aggiornamento dopo partita"
          for i in 1 2 3 4 5; do git pull --rebase && git push && break; sleep $((i*4)); done
