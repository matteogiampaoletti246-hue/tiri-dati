name: Rose da LiveScore - tutti i campionati (Cloudflare KV)
# Una chiave KV per campionato (idx:lg/<paese>/<campionato>). Nessun dato nel repository (e' pubblico). Il referto (solo conteggi) e' nei log.
on:
  workflow_dispatch:
    inputs:
      offset: { description: 'da quale campionato', default: '0' }
      limite: { description: 'quanti campionati', default: '30' }
  schedule:
    - cron: '35 4 * * *'
permissions:
  contents: write
jobs:
  rose:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: 344b4f68fd540269085abbf16851253c
      CF_NAMESPACE: 02759a8a953d423dbd19c58fb8241c34
    steps:
      - uses: actions/checkout@v4
      - name: Rose
        run: |
          [ -z "$CLOUDFLARE_API_TOKEN" ] && { echo "token mancante"; exit 1; }
          python3 -u tools/rose_livescore_all.py "${{ inputs.offset || '0' }}" "${{ inputs.limite || '400' }}" | tee /tmp/rep.txt
      - name: Referto (solo nomi campionato e conteggi)
        run: |
          mkdir -p /tmp/ro && cp /tmp/rep.txt /tmp/ro/referto.txt && cd /tmp/ro && git init -q -b rose-out && git config user.name github-actions && git config user.email github-actions@users.noreply.github.com
          git add -A && git commit -qm "Referto rose" && git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" rose-out
