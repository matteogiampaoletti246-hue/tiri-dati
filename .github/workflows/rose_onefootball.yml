name: Rose da OneFootball (Cloudflare KV)
# Seconda fonte per i campionati senza rose LiveScore. Nessun dato nel repository; il referto (solo conteggi) va nel ramo rose-out-of.
on:
  workflow_dispatch:
  schedule:
    - cron: '50 6 * * *'
permissions:
  contents: write
concurrency:
  group: rose-kv
  cancel-in-progress: false
jobs:
  rose:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: 344b4f68fd540269085abbf16851253c
      CF_NAMESPACE: 02759a8a953d423dbd19c58fb8241c34
    steps:
      - uses: actions/checkout@v4
      - name: Rose
        run: |
          set -o pipefail
          [ -z "$CLOUDFLARE_API_TOKEN" ] && { echo "token mancante"; exit 1; }
          python3 -u tools/rose_onefootball.py 400 | tee /tmp/rep.txt
      - name: Referto
        if: always()
        run: |
          mkdir -p /tmp/ro && cp /tmp/rep.txt /tmp/ro/referto.txt 2>/dev/null; cd /tmp/ro && git init -q -b rose-out-of && git config user.name github-actions && git config user.email github-actions@users.noreply.github.com
          git add -A && git commit -qm "Referto rose OneFootball" && git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" rose-out-of
