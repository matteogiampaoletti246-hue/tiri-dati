name: Nomi veri (soprannomi)
on:
  workflow_dispatch:
    inputs:
      minuti:
        description: 'Minuti di lavoro'
        required: false
        default: '40'
  schedule:
    - cron: '37 4 * * *'
permissions:
  contents: write
concurrency:
  group: nomi
  cancel-in-progress: false
jobs:
  nomi:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python nomi.py
        env:
          NOMI_MIN: ${{ github.event.inputs.minuti || '40' }}
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add nomi.json nomi_nascite.json
          git diff --staged --quiet || git commit -m "Nomi veri dei giocatori (Wikidata)"
          for i in 1 2 3 4 5; do git pull --rebase && git push && break; sleep $((i*4)); done
