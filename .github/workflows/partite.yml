name: Partite storiche
on:
  workflow_dispatch:
  schedule:
    - cron: "41 */6 * * *"
  push:
    paths:
      - partite.py
concurrency:
  group: partite-main
  cancel-in-progress: false
permissions:
  contents: write
  actions: write
jobs:
  turno:
    runs-on: ubuntu-latest
    timeout-minutes: 130
    strategy:
      fail-fast: false
      matrix:
        include:
          - {shard: 0, years: "2026"}
          - {shard: 1, years: "2025"}
          - {shard: 2, years: "2024"}
          - {shard: 3, years: "2023"}
          - {shard: 4, years: "2022"}
          - {shard: 5, years: "2021"}
          - {shard: 6, years: "2020,2019"}
          - {shard: 7, years: "2018,2017,2016,2015,2014,2013,2012,2011,2010"}
    concurrency:
      group: partite-turno-${{ matrix.shard }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: SHARD=${{ matrix.shard }} NSHARD=8 YEARS=${{ matrix.years }} CAPN=4 BUDGET_MIN=110 python partite.py
      - name: Salva
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add partite 2>/dev/null || true
          git diff --staged --quiet || git commit -m "Partite storiche turno ${{ matrix.shard }}"
          for i in 1 2 3 4 5 6; do git pull --rebase && git push && break; sleep $((i*5)); done
  riparti:
    needs: turno
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          resta=0; capp=0
          for i in 0 1 2 3 4 5 6 7; do
            [ -f partite/.done$i ] || resta=1
            [ -f partite/.cap$i ] && capp=1
          done
          if [ $resta = 1 ] && [ $capp = 0 ]; then gh workflow run partite.yml --ref ${{ github.ref_name }}; fi
