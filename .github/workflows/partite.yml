name: Aggiorna partite
on:
  schedule:
    - cron: "10 7-23 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: partite-json
  cancel-in-progress: false
jobs:
  partite:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Libreria immagini
        run: pip install pillow
      - name: Partite, classifiche e formazioni
        run: python update_partite.py
        env:
          PITCHAPI_KEY: ${{ secrets.PITCHAPI_KEY }}
      - name: Salva
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add partite.json foto.json teams.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "Aggiorna partite"
          for i in 1 2 3 4 5; do git pull --rebase && git push && break; sleep $((i*4)); done
