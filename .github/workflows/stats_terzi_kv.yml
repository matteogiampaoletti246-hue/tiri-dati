name: Statistiche di fonti terze -> Cloudflare KV (poi tolte dal repository)
on: workflow_dispatch
concurrency:
  group: partite-main
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  sposta:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: 344b4f68fd540269085abbf16851253c
      CF_NAMESPACE: 02759a8a953d423dbd19c58fb8241c34
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -u tools/stats_terzi_kv.py carica
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            python3 -u tools/stats_terzi_kv.py toglie
            git add -A partite
            git diff --staged --quiet && break
            git commit -qm "Statistiche di fonti terze spostate su Cloudflare KV (tolte dal repository pubblico)"
            git fetch -q origin main && git rebase -q origin/main && git push -q origin HEAD:main && break
            git rebase --abort 2>/dev/null; git reset -q --hard origin/main; sleep $((i*5))
          done
