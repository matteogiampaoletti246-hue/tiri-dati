name: Indice giocatori
on:
  schedule:
    - cron: "50 5 * * *"
  workflow_dispatch:
  push:
    paths:
      - giocatori_indice.py
      - controllo_squadre.py
permissions:
  contents: write
jobs:
  indice:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python giocatori_indice.py
      # controllo: ogni squadra della stagione in corso ha Statistiche e Giocatori (elenco delle vuote e motivo)
      - run: python controllo_squadre.py
      - name: Salva i risultati
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add pidx controllo_squadre.json
          git diff --staged --quiet || git commit -m "Aggiorna indice giocatori"
          for i in 1 2 3 4 5; do git pull --rebase && git push && break; sleep $((i*4)); done
