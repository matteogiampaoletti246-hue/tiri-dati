name: Test WebKit (Safari)
on:
  workflow_dispatch:
  push:
    paths:
      - webkit.trigger
concurrency:
  group: webkit
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: |
          mkdir -p /tmp/wk && cd /tmp/wk && npm init -y >/dev/null && npm i playwright@1.47.2 pngjs@7 >/dev/null
          npx playwright install --with-deps webkit
      - run: NODE_PATH=/tmp/wk/node_modules node --input-type=module -e "import('/tmp/wk/node_modules/playwright/index.mjs').then(()=>0)" ; cp .github/webkit/test.mjs /tmp/wk/test.mjs && cd /tmp/wk && cp -r $GITHUB_WORKSPACE/. /tmp/wk/repo 2>/dev/null; cd /tmp/wk && node test.mjs && cp -r webkit-out webkit-report.json $GITHUB_WORKSPACE/ || true
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add webkit-out webkit-report.json || true
          git diff --staged --quiet || git commit -m "Test WebKit: rapporto"
          for i in 1 2 3 4 5 6; do git pull --rebase && git push && break; sleep $((i*5)); done
