name: Diagnosi statistiche
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  diagnosi:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python diagnosi.py
        env:
          PITCHAPI_KEY: ${{ secrets.PITCHAPI_KEY }}
      - name: Salva
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add diag.json
          git diff --staged --quiet || git commit -m "Diagnosi"
          git pull --rebase
          git push
