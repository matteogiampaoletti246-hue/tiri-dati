name: Qualificazioni
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  q:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python qualificazioni.py
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add selezione.json
          git diff --staged --quiet || git commit -m "Qualificazioni in selezione"
          for i in 1 2 3 4 5; do git pull --rebase && git push && break; sleep $((i*4)); done
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run archivio.yml --ref main
