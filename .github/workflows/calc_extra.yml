name: Affidabilita campionati aggiunti
# Medie squadre e statistiche giocatori (tiri, minuti) di Eredivisie, Pro League, Superliga, Super League, Liga Portugal, Super Lig
# dall'archivio FotMob (partite/ e arch/): calc_extra.json. L'app lo unisce a data.json e giocatori.json.
on:
  workflow_dispatch:
  schedule:
    - cron: "23 */2 * * *"
  push:
    paths:
      - calc_extra.py
      - matchup_nazionali.py
      - profili.py
      - femminili.py
concurrency:
  group: calc-extra
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  calc:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python calc_extra.py
      # Migliori Matchup: partite delle nazionali (Nations League) con le medie attese, dall'archivio FotMob
      - run: python matchup_nazionali.py
      # tutte le altre competizioni con tiri (calc_tutte.json, ~6 MB): rigenerato a mano, a ogni modifica degli script e ogni 6 ore
      - id: tutte
        run: |
          if [ "${{ github.event_name }}" != "schedule" ] || [ $(( 10#$(date -u +%H) % 6 )) -lt 2 ]; then
            python calc_extra.py --tutte
            echo "agg=1" >> "$GITHUB_OUTPUT"
          fi
      # stessi profili e partite per l'Hit Rate di giocatori.json (profili.py), qui solo calc_extra.json
      - run: python profili.py --calc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: 344b4f68fd540269085abbf16851253c
          CF_NAMESPACE: 02759a8a953d423dbd19c58fb8241c34
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add calc_extra.json matchup_nazionali.json
          if [ "${{ steps.tutte.outputs.agg }}" = "1" ]; then git add calc_tutte.json; else git checkout -- calc_tutte.json 2>/dev/null || true; fi
          git diff --staged --quiet || git commit -m "Affidabilita campionati aggiunti"
          for i in 1 2 3 4 5 6; do git pull --rebase && git push && break; sleep $((i*5)); done
