name: Rose campionati minori
on:
  schedule:
    - cron: "35 5 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rose:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python update_rose.py
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      - name: Salva
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add rose.json
          git diff --staged --quiet || git commit -m "Aggiorna rose"
          for i in 1 2 3 4 5; do git pull --rebase && git push && break; sleep $((i*4)); done
      # tutte le squadre dell'indice tidx (giro a tempo: prima la stagione in corso)
      - run: python rose_tutte.py
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          AF_BUDGET: "20"
          ROSE_MIN: "50"
      - name: Salva le rose di tutte le squadre
        run: |
          git add rosa
          git diff --staged --quiet || git commit -m "Aggiorna rose di tutte le squadre"
          for i in 1 2 3 4 5; do git pull --rebase && git push && break; sleep $((i*4)); done
