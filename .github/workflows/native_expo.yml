name: App nativa (Expo) - pubblica la Home di prova
# Costruisce il prototipo React Native in native/ e lo pubblica su Expo (EAS Update): si apre con Expo Go dal telefono.
# Serve il secret EXPO_TOKEN. Il link da aprire finisce nel ramo "native-out" (link.txt).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['native/**', 'aurora-src/src/data/**', 'aurora-src/src/lib/**', 'aurora-src/src/components/calc/calcComp.js', 'aurora-src/src/components/player/playerCalc.js', 'aurora-src/src/hooks/useAsync.js', 'aurora-src/stadi/mappa.json']
permissions:
  contents: write
concurrency:
  group: native-expo
  cancel-in-progress: false
jobs:
  publica:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Controlla il token
        run: |
          if [ -z "$EXPO_TOKEN" ]; then echo "EXPO_TOKEN mancante" ; exit 1; fi
      - name: Prova di avvio (errori che sul telefono fanno schermata rossa)
        run: |
          npm install --no-save --prefix /tmp/sm react@19 >/dev/null 2>&1
          NODE_PATH=/tmp/sm/node_modules node native/tools/smoke.cjs
      - name: Crea il progetto Expo con l'ultimo SDK e copia la Home di prova
        run: |
          npx --yes create-expo-app@latest app --template blank --no-install
          node native/tools/gen_meta.mjs aurora-src/src app/meta.json
          (cd native/tools && npm install sharp --no-save --no-audit --no-fund)
          node native/tools/gen_flags.mjs app/meta.json native-link/flags
          cp native/App.js app/App.js
          printf '{"sha":"%s"}' "$GITHUB_SHA" > app/build.json
          cp -r native/pages app/pages
          cp -r native/shared app/shared && cp aurora-src/stadi/mappa.json app/shared/stadiMappa.json
          cp native/metro.config.js app/metro.config.js
          mkdir -p app/src/components/calc && cp -r aurora-src/src/data aurora-src/src/lib app/src/ && cp aurora-src/src/components/calc/calcComp.js app/src/components/calc/ && mkdir -p app/src/components/player app/src/hooks && cp aurora-src/src/components/player/playerCalc.js app/src/components/player/ && cp aurora-src/src/hooks/useAsync.js aurora-src/src/hooks/useArchFresh.js aurora-src/src/hooks/useNextMatch.js app/src/hooks/
          cd app
          npm install --no-audit --no-fund
          npm install fflate --no-audit --no-fund
          npx expo install expo-updates expo-image @react-native-async-storage/async-storage expo-linear-gradient react-native-safe-area-context @expo/vector-icons react-native-gesture-handler react-native-reanimated expo-blur react-native-svg
          if [ "$(node -p "parseInt(require('react-native-reanimated/package.json').version)")" -ge 4 ]; then npx expo install react-native-worklets; fi
          node -e "const f='app.json',j=require('./'+f);j.expo.owner='lozellatos-team';require('fs').writeFileSync(f,JSON.stringify(j,null,2))"
          npx --yes eas-cli@latest whoami
          npx --yes eas-cli@latest init --non-interactive --force
          npx --yes eas-cli@latest update:configure --non-interactive || true
      - name: Pubblica
        run: |
          cd app
          npx --yes eas-cli@latest update --branch main --message "Home di prova nativa $GITHUB_SHA" --non-interactive 2>&1 | tee /tmp/update.txt
          mkdir -p /tmp/no && grep -Eo 'https://[^ ]+' /tmp/update.txt > /tmp/no/link.txt || true
          node -e "const a=require('./app.json').expo;console.log(JSON.stringify({slug:a.slug,id:a.extra&&a.extra.eas&&a.extra.eas.projectId,owner:a.owner}))" > /tmp/no/info.json || true
      - name: Link fisso (native-link/latest.json)
        run: |
          G=$(grep -Eo 'Update group ID +[0-9a-f-]+' /tmp/update.txt | awk '{print $NF}')
          ID=$(node -p "require('./app/app.json').expo.extra.eas.projectId")
          if [ -n "$G" ] && [ -n "$ID" ]; then
            git config user.name github-actions && git config user.email github-actions@users.noreply.github.com
            AT=$(TZ=Europe/Rome date '+%d/%m %H:%M')
            for i in 1 2 3 4 5 6 7 8; do
              git fetch -q origin main && git reset -q --hard origin/main
              mkdir -p native-link
              printf '{"id":"%s","group":"%s","sha":"%s","at":"%s"}\n' "$ID" "$G" "$GITHUB_SHA" "$AT" > native-link/latest.json
              printf 'exp://u.expo.dev/%s/group/%s' "$ID" "$G" > native-link/url.txt
              git add native-link/latest.json native-link/url.txt
              git commit -qm "App nativa: ultima versione ($G)" || break
              git push -q origin HEAD:main && break
              sleep 4
            done
          fi
      - name: Salva nel ramo native-out
        if: always()
        run: |
          mkdir -p /tmp/no && cp /tmp/update.txt /tmp/no/log.txt 2>/dev/null || true
          cd /tmp/no && git init -q -b native-out && git config user.name github-actions && git config user.email github-actions@users.noreply.github.com
          git add -A && git commit -qm "Expo $GITHUB_SHA" && git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" native-out
