name: Nomi dei giocatori da FotMob
on:
  workflow_dispatch:
    inputs:
      minuti:
        description: 'Minuti di lavoro'
        required: false
        default: '40'
  schedule:
    - cron: '17 5 * * *'
  push:
    paths:
      - nomi_fm.py
permissions:
  contents: write
concurrency:
  group: nomi-fm
  cancel-in-progress: false
jobs:
  nomi:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python nomi_fm.py
        env:
          NOMI_MIN: ${{ github.event.inputs.minuti || '40' }}
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add nomi_fm.json
          git diff --staged --quiet || git commit -m "Nomi dei giocatori come su FotMob"
          for i in 1 2 3 4 5; do git pull --rebase && git push && break; sleep $((i*4)); done
