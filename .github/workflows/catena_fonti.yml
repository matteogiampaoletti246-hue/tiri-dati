name: Catena fonti giocatori (PitchAPI, LiveScore, diretta.it) + resoconto
# Un solo lavoro in fila (PitchAPI -> LiveScore -> diretta.it -> resoconto), in un gruppo suo: nel gruppo partite-main le esecuzioni in attesa si annullano
# a vicenda (una sola in attesa per gruppo). kvstats.save unisce con quanto c'e' sul KV, quindi scrivere insieme agli altri programmi e' sicuro.
on:
  workflow_dispatch:
  schedule:
    - cron: "11 2,14 * * *"
concurrency:
  group: fonti-giocatori
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  catena:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      PITCHAPI_KEY: ${{ secrets.PITCHAPI_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: 344b4f68fd540269085abbf16851253c
      CF_NAMESPACE: 02759a8a953d423dbd19c58fb8241c34
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: PitchAPI
        run: python giocatori_pitch.py
        env: { MAX_MIN: "120", MAX_MATCH: "6000" }
        continue-on-error: true
      - name: LiveScore
        run: python giocatori_livescore.py
        env: { MAX_MIN: "90", MAX_MATCH: "6000" }
        continue-on-error: true
      - name: diretta.it
        run: python giocatori_diretta.py
        env: { MAX_MIN: "40" }
        continue-on-error: true
      - name: Resoconto
        run: python resoconto_fonti.py
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -f pitch_giocatori.json pitch_stato.json livescore_giocatori.json livescore_stato.json diretta_giocatori.json diretta_stato.json resoconto_fonti.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "Catena fonti giocatori + resoconto"
          for i in 1 2 3 4 5; do git pull --rebase -X theirs && git push && break; sleep $((i*4)); done
