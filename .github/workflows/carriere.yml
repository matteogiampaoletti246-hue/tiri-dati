name: Carriere giocatori
on:
  schedule:
    - cron: "20 4 * * 1"
  workflow_dispatch:
  push:
    paths:
      - carriere.py
permissions:
  contents: write
jobs:
  carriere:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python carriere.py
      - name: Salva i risultati
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add carriere.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "Aggiorna carriere giocatori"
          for i in 1 2 3 4 5; do git pull --rebase && git push && break; sleep $((i*4)); done
