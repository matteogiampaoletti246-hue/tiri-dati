name: Foto stadi (interno prima, poi esterno)
on:
  workflow_dispatch:
  push:
    paths:
      - foto_stadi.py
      - stadi_scelte.json
      - stadi_scarta.json
      - foto_stadi.trigger
permissions:
  contents: write
concurrency:
  group: foto-stadi-${{ github.ref }}
  cancel-in-progress: true
jobs:
  foto:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install --quiet torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet open_clip_torch pillow
      - run: python foto_stadi.py
      - name: Salva i risultati
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add aurora-src/stadi aurora-src/src/data/creditiStadi.js report/stadi
          git diff --staged --quiet || git commit -m "Foto stadi: interni e nazionali"
          for i in 1 2 3; do git pull --rebase -X ours origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break; sleep 5; done
