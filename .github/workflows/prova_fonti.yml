name: Prova fonti (raggiungibilita dal runner)
# Cerca un elenco dei campionati di LiveScore (robots.txt, sitemap). Referto (solo conteggi e indirizzi) nel ramo rose-out.
on: workflow_dispatch
permissions:
  contents: write
jobs:
  prova:
    runs-on: ubuntu-latest
    steps:
      - name: Prova
        run: |
          mkdir -p /tmp/po
          UA='Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15 Mobile Safari/604.1'
          for u in https://www.livescore.com/sitemap.xml https://www.livescore.com/en/sitemap.xml; do
            curl -sS --compressed -m 25 -L -A "$UA" "$u" | head -c 2500 | tee -a /tmp/po/referto.txt; echo | tee -a /tmp/po/referto.txt
          done
          git init -q -b rose-out /tmp/po && cd /tmp/po && git config user.name github-actions && git config user.email github-actions@users.noreply.github.com
          git add -A && git commit -qm "Referto" && git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" rose-out
