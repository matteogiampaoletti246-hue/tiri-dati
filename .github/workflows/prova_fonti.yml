name: Prova fonti (raggiungibilita dal runner)
# Controlla cosa contengono LiveScore e OneFootball per l'Algeria (Ligue 1) rispetto a FotMob. Referto nel ramo probe-out.
on: workflow_dispatch
permissions:
  contents: write
jobs:
  prova:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prova
        run: |
          mkdir -p /tmp/po
          UA='Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15 Mobile Safari/604.1'
          g() { curl -sS -m 25 -L -A "$UA" -H 'Accept-Language: en' -o "$2" -w "%{http_code} %{size_download} $1\n" "$1" 2>&1 | tail -1 | tee -a /tmp/po/referto.txt; }
          B="https://www.livescore.com/en/football/algeria/ligue-1/us-biskra-vs-mc-alger/1854239"
          g "$B/" /tmp/po/m_sum.html
          g "$B/lineups/" /tmp/po/m_lineups.html
          g "$B/stats/" /tmp/po/m_stats.html
          for f in m_sum m_lineups m_stats; do
            python3 - "$f" <<'PY' | tee -a /tmp/po/referto.txt
import re,json,sys
f=sys.argv[1]
s=open('/tmp/po/'+f+'.html',encoding='utf8',errors='ignore').read()
m=re.search(r'<script id="__NEXT_DATA__"[^>]*>(.*?)</script>',s,re.S)
if not m: print('---',f,'senza NEXT_DATA'); sys.exit()
j=json.loads(m.group(1)); i=j['props']['pageProps'].get('initialData') or j['props']['pageProps']
print('---',f,'chiavi:',list(i.keys())[:12])
t=json.dumps(i,ensure_ascii=False)
print('   byte',len(t),'| giocatori(playerName/name con photo):',len(re.findall(r'"(?:playerName|PlayerName|firstName)"',t)),'| lineup/Formation:',len(re.findall(r'(?i)formation|lineup',t)),'| stat:',len(re.findall(r'(?i)shots|possession|corners',t)))
PY
          done
      - name: Salva
        run: |
          cd /tmp/po && for f in *.html; do head -c 300000 "$f" > "$f.cut" && mv "$f.cut" "$f"; done
          git init -q -b probe-out && git config user.name github-actions && git config user.email github-actions@users.noreply.github.com
          git add -A && git commit -qm "Referto fonti" && git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" probe-out
