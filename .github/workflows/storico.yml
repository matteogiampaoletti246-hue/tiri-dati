name: Aggiorna storico partite
on:
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  storico:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Leggi le partite finite
        run: python update_storico.py
        env:
          PITCHAPI_KEY: ${{ secrets.PITCHAPI_KEY }}
      - name: Salva i risultati
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add match storico.json arbitri.json stadi.json diag_storico.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "Aggiorna storico"
          for i in 1 2 3 4 5; do git pull --rebase && git push && break; sleep $((i*4)); done
