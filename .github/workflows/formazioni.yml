name: Aggiorna formazioni
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: partite-json
  cancel-in-progress: false
jobs:
  formazioni:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Formazioni delle partite in arrivo
        run: python update_partite.py --formazioni
        env:
          PITCHAPI_KEY: ${{ secrets.PITCHAPI_KEY }}
          WINDOW_H: "2"
      - name: Formazioni ufficiali su Cloudflare KV (terza fonte del worker)
        run: python formazioni_kv.py
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: 344b4f68fd540269085abbf16851253c
          CF_NAMESPACE: 02759a8a953d423dbd19c58fb8241c34
      - name: Salva
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add partite.json foto.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "Aggiorna formazioni"
          for i in 1 2 3 4 5; do git pull --rebase && git push && break; sleep $((i*4)); done
