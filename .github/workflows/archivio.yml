name: Archivio storico
on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    paths:
      - archivio.py
      - selezione.json
concurrency: archivio
permissions:
  contents: write
  actions: write
jobs:
  archivio:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: BUDGET_MIN=${{ '320' }} python archivio.py
      - name: Salva
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add arch 2>/dev/null || true
          git diff --staged --quiet || git commit -m "Archivio storico"
          for i in 1 2 3 4 5; do git pull --rebase && git push && break; sleep $((i*4)); done
      - name: Riparti subito se non è finito
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f arch/.complete ]; then gh workflow run archivio.yml --ref ${{ github.ref_name }}; fi
