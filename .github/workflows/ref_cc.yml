name: Aggiorna arbitri coppe
on:
  schedule:
    - cron: "40 5 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  arbitri:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python update_ref_cc.py
      - name: Salva i risultati
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add refcc.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "Aggiorna arbitri coppe"
          for i in 1 2 3 4 5; do git pull --rebase && git push && break; sleep $((i*4)); done
