name: Risultati competizioni aggiunte
# Feed FotMob del giorno (una richiesta copre tutte le leghe): giorni/<data>.json per la Home e risultati
# delle stagioni in corso di arch/ (Partite, Tabellone, squadre, giocatori) subito dopo la fine delle partite.
on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"   # ieri, oggi e domani
    - cron: "23 */3 * * *"   # anche i 7 giorni successivi (orari e rinvii)
  push:
    branches: [main]   # i dati si scrivono solo su main (niente copie divergenti su dev da unire)
    paths:
      - risultati.py
concurrency: risultati
permissions:
  contents: write
jobs:
  risultati:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      # solo libreria standard: basta il python3 gia' presente nel runner (niente setup a ogni giro, 144 giri al giorno)
      - name: Scarica
        run: |
          if [ "${{ github.event.schedule }}" = "23 */3 * * *" ] || [ "${{ github.event_name }}" != "schedule" ]; then export DAYS="-2..7"; else export DAYS="-1..1"; fi
          python3 risultati.py
      - name: Salva
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add giorni arch 2>/dev/null || true
          git diff --staged --quiet && exit 0
          git commit -m "Risultati competizioni aggiunte"
          for i in 1 2 3 4 5; do git pull --rebase && git push && break; sleep $((i*4)); done
