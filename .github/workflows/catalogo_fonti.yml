name: Catalogo fonti
on:
  workflow_dispatch:
  push:
    paths:
      - catalogo_fonti.py
permissions:
  contents: write
jobs:
  catalogo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python catalogo_fonti.py
      - name: Salva
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add catalogo_raw.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "Catalogo fonti"
          for i in 1 2 3 4 5; do git pull --rebase && git push && break; sleep $((i*4)); done
