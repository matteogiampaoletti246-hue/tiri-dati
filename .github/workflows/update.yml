name: Aggiorna dati
on:
  schedule:
    - cron: "0 23 * * *"
    - cron: "0 5 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python update_data.py
        env:
          PITCHAPI_KEY: ${{ secrets.PITCHAPI_KEY }}
      - name: Angoli e cartellini
        continue-on-error: true
        run: python update_angoli.py
        env:
          PITCHAPI_KEY: ${{ secrets.PITCHAPI_KEY }}
      - name: Giocatori
        continue-on-error: true
        timeout-minutes: 45
        run: python update_giocatori.py
        env:
          PITCHAPI_KEY: ${{ secrets.PITCHAPI_KEY }}
      # profili unici (id FotMob, doppi uniti), partite mancanti da FotMob e partite per l'Hit Rate (profili.py)
      - name: Profili giocatori
        continue-on-error: true
        timeout-minutes: 20
        run: python profili.py --giocatori
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: 344b4f68fd540269085abbf16851253c
          CF_NAMESPACE: 02759a8a953d423dbd19c58fb8241c34
      - name: Statistiche giocatori
        continue-on-error: true
        timeout-minutes: 45
        run: python update_stats.py
        env:
          PITCHAPI_KEY: ${{ secrets.PITCHAPI_KEY }}
      - name: Salva i risultati
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data.json cache.json
          git add angoli.json cache_angoli.json 2>/dev/null || true
          git add giocatori.json cache_giocatori.json report/profili_uniti.json report/profili_stato.json 2>/dev/null || true
          git add squadre.json stats.json cache_stats.json diag2.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "Aggiorna dati"
          for i in 1 2 3 4 5; do git pull --rebase && git push && break; sleep $((i*4)); done
