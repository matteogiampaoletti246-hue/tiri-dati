name: Infortuni giocatori
on:
  schedule:
    - cron: "40 5 * * *"
    - cron: "40 14 * * *"
  workflow_dispatch:
  push:
    paths:
      - infortuni.py
permissions:
  contents: write
jobs:
  infortuni:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python infortuni.py
      - name: Salva i risultati
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add infortuni.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "Aggiorna infortuni"
          for i in 1 2 3 4 5; do git pull --rebase && git push && break; sleep $((i*4)); done
