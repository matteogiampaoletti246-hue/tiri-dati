name: Infortuni giocatori
# Controllo a tappeto 3 volte al giorno (ore italiane ~5:40, 11:40, 17:40): FotMob + LiveScore, rientrati tolti da soli.
on:
  schedule:
    - cron: "40 4 * * *"
    - cron: "40 10 * * *"
    - cron: "40 16 * * *"
  workflow_dispatch:
  push:
    paths:
      - infortuni.py
      - .github/workflows/infortuni.yml
concurrency:
  group: infortuni
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  infortuni:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python infortuni.py
        env:
          MAX_MIN: "40"
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: 344b4f68fd540269085abbf16851253c
          CF_NAMESPACE: 02759a8a953d423dbd19c58fb8241c34
      - name: Salva i risultati
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add infortuni.json report/infortuni_stato.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "Aggiorna infortuni"
          for i in 1 2 3 4 5; do git pull --rebase -X theirs && git push && break; sleep $((i*4)); done
