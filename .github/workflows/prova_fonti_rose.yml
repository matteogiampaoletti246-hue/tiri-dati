name: Prova fonti rose (temporanea)
on:
  push:
    branches: [rose-stat]
    paths:
      - .github/workflows/prova_fonti_rose.yml
permissions:
  contents: read
jobs:
  fonti:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: LiveScore ricerca
        run: curl -sS -m 25 -A "Mozilla/5.0 (iPhone)" "https://prod-cdn-search-api.livescore.com/api/v2/search/soccer/team?query=Van&limit=30" | grep -q 'enet/1078400.png'
      - name: LiveScore rosa
        run: curl -sS -m 25 -A "Mozilla/5.0 (iPhone)" "https://www.livescore.com/en/football/team/x/7358/squad/" | grep -q 'initialData'
      - name: OneFootball ricerca
        run: curl -sS -m 25 -A "Mozilla/5.0 (iPhone)" "https://search-api.onefootball.com/v2/en/search?q=Van" | grep -q '"id":20340'
      - name: OneFootball rosa
        run: curl -sS -m 25 -A "Mozilla/5.0 (iPhone)" "https://vintagemonster.onefootball.com/api/teams/en/20340.json" | grep -q '"players"'
      - name: FotMob squadra
        run: curl -sS -m 25 -A "Mozilla/5.0 (iPhone)" "https://www.fotmob.com/api/data/teams?id=866109&ccode3=ITA" | grep -q '"squad"'
      - name: FotMob ricerca giocatore
        run: curl -sS -m 25 -A "Mozilla/5.0 (iPhone)" "https://apigw.fotmob.com/searchapi/suggest?term=Khalil%20Ahmad%20Sammani&lang=en" | grep -q '2068031'
      - name: FotMob scheda giocatore
        run: curl -sS -m 25 -A "Mozilla/5.0 (iPhone)" "https://www.fotmob.com/api/data/playerData?id=2068031" | grep -q 'positionDescription'
