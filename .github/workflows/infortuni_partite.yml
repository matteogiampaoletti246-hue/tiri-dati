name: Infortuni partite
# Infortunati, squalificati e non convocati per partita (club e nazionali), ogni 3 ore: FotMob, dati nel repository.
on:
  schedule:
    - cron: "20 */3 * * *"
  workflow_dispatch:
  push:
    paths:
      - infortuni_partite.py
      - .github/workflows/infortuni_partite.yml
concurrency:
  group: infortuni_partite
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  infortuni:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python infortuni_partite.py
        env:
          MAX_MIN: "40"
      - name: Salva i risultati
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add infortuni_partite.json report/infortuni_partite_stato.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "Aggiorna infortuni partite"
          for i in 1 2 3 4 5; do git pull --rebase -X theirs && git push && break; sleep $((i*4)); done
