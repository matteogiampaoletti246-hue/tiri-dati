<!doctype html>
<html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Home di prova</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#0b0d12;color:#e8eaf0;font:14px -apple-system,system-ui,sans-serif;overscroll-behavior:none}
#bar{position:fixed;top:0;left:0;right:0;z-index:5;background:#11141b;padding:env(safe-area-inset-top) 0 0;border-bottom:1px solid #222836}
#strip{display:flex;gap:6px;overflow-x:auto;padding:10px 10px;scrollbar-width:none}
#strip::-webkit-scrollbar{display:none}
.d{flex:0 0 auto;padding:8px 12px;border-radius:12px;background:#1a1f2b;font-weight:600;text-align:center;min-width:58px}
.d.on{background:#3b82f6;color:#fff}
#hud{font:11px ui-monospace,monospace;padding:0 12px 6px;color:#8b93a7}
#view{position:relative;overflow:hidden;margin-top:calc(env(safe-area-inset-top) + 92px);touch-action:pan-y}
#track{display:grid;will-change:transform}
.pane{grid-area:1/1;min-width:0;min-height:80vh;overflow:visible;will-change:transform}
.g{content-visibility:auto;contain-intrinsic-size:auto 300px;margin:10px 10px 0;background:#151a24;border-radius:14px;overflow:hidden}
.gh{padding:10px 12px;font-weight:700;border-bottom:1px solid #222836;color:#aab3c8}
.r{display:grid;grid-template-columns:1fr 54px 1fr;align-items:center;gap:6px;padding:10px 12px;border-bottom:1px solid #1d2331}
.t{display:flex;align-items:center;gap:8px;min-width:0}.t.o{justify-content:flex-end;text-align:right}
.t img{width:22px;height:22px;flex:none}.t span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.s{text-align:center;font-weight:700}.s small{display:block;font-weight:400;color:#8b93a7}
.nm{padding:50px;text-align:center;color:#8b93a7}
</style></head><body>
<div id="bar"><div id="strip"></div><div id="hud">caricamento…</div></div>
<div id="view"><div id="track"><div class="pane" id="p0"></div><div class="pane" id="p1"></div><div class="pane" id="p2"></div></div></div>
<script>
(async()=>{
const R='../';const j=async u=>(await fetch(R+u)).json();
const idx=await j('arch/index.json');
const days=[];for(let i=-3;i<=6;i++){const d=new Date();d.setDate(d.getDate()+i);days.push(d.toLocaleDateString('sv-SE',{timeZone:'Europe/Rome'}))}
const by={};const all=[];
for(const k of days){try{const f=await j('giorni/'+k+'.json');f.m.forEach(m=>all.push(m))}catch(e){}}
const seen=new Set();
for(const m of all){if(seen.has(m[0]))continue;seen.add(m[0]);const k=new Date(m[2]).toLocaleDateString('sv-SE',{timeZone:'Europe/Rome'});(by[k]=by[k]||[]).push(m)}
const html={};
const logo=id=>'https://images.fotmob.com/image_resources/logo/teamlogo/'+id+'.png';
const esc=s=>String(s).replace(/[&<]/g,c=>c=='&'?'&amp;':'&lt;');
function build(k){if(html[k])return html[k];const ms=(by[k]||[]).slice().sort((a,b)=>a[2]<b[2]?-1:1);if(!ms.length)return html[k]='<div class="nm">Nessuna partita</div>';
const g={};ms.forEach(m=>(g[m[1]]=g[m[1]]||[]).push(m));let h='';
for(const fm of Object.keys(g)){const n=(idx[fm]||{}).n||('Competizione '+fm);h+='<div class="g"><div class="gh">'+esc(n)+'</div>';
for(const m of g[fm]){const t=new Date(m[2]).toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit',timeZone:'Europe/Rome'});
h+='<div class="r"><div class="t"><img loading="lazy" decoding="async" src="'+logo(m[3])+'" alt=""><span>'+esc(m[5])+'</span></div><div class="s">'+(m[7]||t)+'<small>'+(m[8]=='l'?'LIVE':m[8]=='f'?'Fin':'')+'</small></div><div class="t o"><span>'+esc(m[6])+'</span><img loading="lazy" decoding="async" src="'+logo(m[4])+'" alt=""></div></div>'}
h+='</div>'}
return html[k]=h}
const P=[p0,p1,p2],tr=track,W=()=>innerWidth;
let cur=days.indexOf(new Date().toLocaleDateString('sv-SE',{timeZone:'Europe/Rome'}));
const strip=document.getElementById('strip');
days.forEach((k,i)=>{const e=document.createElement('div');e.className='d';const d=new Date(k+'T12:00:00');e.innerHTML=d.toLocaleDateString('it-IT',{weekday:'short'})+'<br>'+d.getDate()+'/'+(d.getMonth()+1);e.onclick=()=>jump(i);strip.appendChild(e)});
// 3 caselle fisse: non si ricostruiscono, cambiano solo ruolo (posizione); il giorno nuovo si riempie fuori schermo
const slotDay=[null,null,null];
const role=sl=>((((sl-cur%3)+1)%3)+3)%3-1;   // -1 sinistra, 0 centro, 1 destra
function place(){P.forEach((e,sl)=>{const r=role(sl);e.style.transform='translate3d('+(r*100)+'%,0,0)';e.style.height=r?'0':'';e.style.minHeight=r?'0':'';e.dataset.r=r})}
function fill(sl,dayIdx){const k=days[dayIdx];const e=P[sl];if(slotDay[sl]===dayIdx)return;slotDay[sl]=dayIdx;e.innerHTML=(dayIdx>=0&&dayIdx<days.length)?build(k):''}
function fillAll(){P.forEach((e,sl)=>{const r=role(sl);if(r===0)fill(sl,cur)});setTimeout(()=>P.forEach((e,sl)=>{const r=role(sl);if(r)fill(sl,cur+r)}),0)}
function mark(){[...strip.children].forEach((e,i)=>e.classList.toggle('on',i==cur));const e=strip.children[cur];strip.scrollTo({left:e.offsetLeft-W()/2+e.offsetWidth/2})}
// assegna ai tre posti i giorni giusti
function init(){for(let sl=0;sl<3;sl++){const r=role(sl);slotDay[sl]=null;fill(sl,cur+r)}place();mark()}
init();
function jump(i){if(i===cur)return;const d=i-cur;cur=i;tr.style.transition='none';tr.style.transform='';init();scrollTo(0,0)}
let sx=0,sy=0,base=0,dx=0,drag=false,lock=0,anim=null,t0=0,lx=0,vx=0;
const curX=()=>new DOMMatrix(getComputedStyle(tr).transform).m41;
function commit(dir){ // la casella uscita prende il giorno nuovo dal lato opposto
  cur+=dir;tr.style.transition='none';tr.style.transform='translate3d(0,0,0)';place();mark();
  P.forEach((e,sl)=>{const r=role(sl);if(r)fill(sl,cur+r)});}
addEventListener('touchstart',e=>{
  sx=e.touches[0].clientX;sy=e.touches[0].clientY;dx=0;drag=true;lock=0;lx=sx;vx=0;t0=performance.now();base=0;
  if(anim){ // swipe durante l'animazione: si riparte da dove siamo, nessuna attesa
    const x0=curX();clearTimeout(anim.id);const dir=anim.dir;anim=null;
    if(dir){commit(dir);base=x0+dir*W();}else{base=x0}
    tr.style.transition='none';tr.style.transform='translate3d('+base+'px,0,0)';lock=1;sx=e.touches[0].clientX;}
},{passive:true});
addEventListener('touchmove',e=>{if(!drag)return;const x=e.touches[0].clientX-sx,y=e.touches[0].clientY-sy;
 if(!lock){if(Math.abs(x)>8||Math.abs(y)>8)lock=Math.abs(x)>Math.abs(y)?1:2;else return}
 if(lock!=1)return;vx=e.touches[0].clientX-lx;lx=e.touches[0].clientX;dx=x;
 let o=base+dx;if((cur===0&&o>0)||(cur===days.length-1&&o<0))o*=.3;
 tr.style.transition='none';tr.style.transform='translate3d('+o+'px,0,0)'},{passive:true});
addEventListener('touchend',()=>{if(!drag)return;drag=false;if(lock!=1)return;
 const o=base+dx;let dir=0;
 if((o<-W()*.22||vx<-9)&&cur<days.length-1)dir=1;else if((o>W()*.22||vx>9)&&cur>0)dir=-1;
 const target=-dir*W();const dist=Math.abs(target-o);const ms=Math.max(120,Math.min(240,dist*0.6));
 tr.style.transition='transform '+ms+'ms cubic-bezier(.2,.8,.2,1)';tr.style.transform='translate3d('+target+'px,0,0)';
 anim={dir,id:setTimeout(()=>{anim=null;commit(dir)},ms+10)}});
// misuratore: fotogrammi lenti
let last=performance.now(),n=0,slow=0,mx=0,tot=0;
const hud=document.getElementById('hud');
function tick(t){const d=t-last;last=t;n++;tot++;if(d>50){slow++}if(d>mx)mx=d;
 if(n>=30){hud.textContent='lenti(>50ms): '+slow+' | peggiore: '+Math.round(mx)+' ms | giorni: '+Object.keys(by).length;n=0}
 requestAnimationFrame(tick)}
requestAnimationFrame(tick);
})();
</script></body></html>
